name: daily-update
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy
      - uses: actions/cache@v4
        with:
          path: cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "football-dash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data/tips.sqlite data/coverage.json data/active_leagues.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%FT%TZ)"
          git push
